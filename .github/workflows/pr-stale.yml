name: PR Stale Management

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  workflow_dispatch:  # Allows manual trigger

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Mark stale PRs
        uses: pagopa/eng-github-actions-iac-template/global/github-stale-close-pr@fix-stale-pr-action
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
